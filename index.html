  const QUESTION_POOL = [
    {id:'MM01',round:1,visualId:'MM01',difficulty:'Medium',prompt:'A prototype disappears from the demo room between 10:00 and 10:10. The room was empty at 10:00. Badge logs show Avery entered at 10:03; Blake’s badge was rejected; Casey was visible on a recorded client call from 9:55–10:15; Drew’s exit was logged at 9:50 and re-entry at 10:20. Who had the opportunity to take it?',options:['Avery','Blake','Casey','Drew'],correctIndex:0,explanation:'Avery was the only suspect confirmed to have entered the room during the disappearance window.'},
    {id:'MM02',round:1,visualId:'MM02',difficulty:'Medium',prompt:'At 2:15, a confidential memo appears in the printer tray. The printer audit shows exactly one print job in that time window, submitted from Morgan’s workstation. The other three suspects’ devices were offline. Who printed the memo?',options:['Riley','Morgan','Jamie','Taylor'],correctIndex:1,explanation:'The printer audit directly identifies Morgan’s workstation as the only source of a print job.'},
    {id:'MM03',round:1,visualId:'MM03',difficulty:'Medium',prompt:'A trophy was cracked after lunch. Exactly one of these statements is true: Alex says, “Blair broke it.” Blair says, “I did not break it.” Casey says, “Alex did not break it.” Who broke the trophy?',options:['Alex','Blair','Casey','There is not enough information'],correctIndex:0,explanation:'If Alex broke it, Blair’s denial is the only true statement. Either other culprit makes at least two statements true.'},
    {id:'MM04',round:1,visualId:'MM04',difficulty:'Medium',prompt:'A muddy zigzag footprint is found inside the archive just after a rainstorm. A sign-in photo clearly shows Quinn’s shoes have the same distinctive zigzag sole; the other suspects have smooth, dotted, or chevron soles. Who left the print?',options:['Quinn','Robin','Sam','Terry'],correctIndex:0,explanation:'The distinctive zigzag tread matches Quinn’s shoes, while the other soles have different patterns.'},
    {id:'MM05',round:1,visualId:'MM05',difficulty:'Medium',prompt:'One sealed envelope had its name label swapped. The replacement label has a blue-ink fingerprint. Dana’s gloves are stained with blue ink; Eli’s hands are clean, Faye uses black ink, and Gus uses a pencil. Who most likely swapped the label?',options:['Eli','Faye','Dana','Gus'],correctIndex:2,explanation:'Only Dana is linked to the specific blue ink found on the replacement label.'},

    {id:'MM09',round:1,visualId:'MM09',difficulty:'Hard',prompt:'A display model was damaged at 19:00. One suspect’s alibi is contradicted by continuous footage: Ana says she stayed at her desk, and the desk camera shows her there; Ben says he never entered the gallery, but the gallery camera clearly records him at 19:01; Cara is continuously visible in a workshop; Dan’s exit scan is at 18:50. Who is the culprit?',options:['Ana','Ben','Cara','Dan'],correctIndex:1,explanation:'Ben’s claim is contradicted by the gallery camera during the only relevant time window.'},
    {id:'MM10',round:1,visualId:'MM10',difficulty:'Hard',prompt:'A rare coin disappeared between 16:00 and 16:10. The cabinet sensor never opened, but its duplicate display coin was removed from a nearby unlocked stand. Four people passed the stand: Ari carried a flat folder, Bo carried an empty tray, Cy carried a sealed box that remained sealed on camera, and Dee carried a transparent tote with the coin visible inside afterward. Who took the coin?',options:['Ari','Bo','Cy','Dee'],correctIndex:3,explanation:'The coin is visible in Dee’s transparent tote after the disappearance; the other observations rule out their containers.'},

    {id:'MM12',round:1,visualId:'MM12',difficulty:'Medium',prompt:'A sealed evidence envelope was opened and resealed. The replacement seal is green. Pat uses green sealing wax, Eli uses red wax, Kim uses blue wax, and Noor uses plain paper seals. Which suspect is linked to the resealing?',options:['Eli','Kim','Pat','Noor'],correctIndex:2,explanation:'The green wax on the replacement seal matches Pat’s distinctive sealing material.'},
    {id:'MM13',round:1,visualId:'MM13',difficulty:'Medium',prompt:'The archive alarm triggered at 20:15. The door log records a successful entry code of 3-1-4 at 20:15. Wren used code 3-1-4, Lee used 3-1-5, Kai had no badge swipe, and Nia’s exit was logged at 20:10. Who entered when the alarm triggered?',options:['Lee','Wren','Kai','Nia'],correctIndex:1,explanation:'The successful code in the log exactly matches Wren’s assigned code, while the other records do not show an entry.'},
    {id:'MM14',round:1,visualId:'MM14',difficulty:'Medium',prompt:'A torn note found beside the missing key has two deep V-shaped notches along its right edge. The four notepads in the office have zero, one, two, and three matching notches respectively. Kira’s pad is the one with two notches. Whose pad matches the fragment?',options:['Ivo','Jules','Kira','Lio'],correctIndex:2,explanation:'The fragment’s two distinctive V-shaped notches match Kira’s notepad exactly.'},
    {id:'MM15',round:1,visualId:'MM15',difficulty:'Hard',prompt:'A model vanished from a locked display room at 12:05. Door and cabinet logs show that the person must have both a valid door entry and the cabinet key during that minute. Ava entered at 12:02 but never signed out the key; Ben signed out the key but his door entry was rejected; Cy has a valid door entry and the cabinet key recorded at 12:04; Dee’s credentials were disabled at 11:55. Who had both required accesses?',options:['Ava','Ben','Cy','Dee'],correctIndex:2,explanation:'Only Cy is confirmed to have both a valid door entry and the cabinet key during the relevant period.'},

    {"id":"MM16","round":1,"visualId":"MM16","visualSummary":"Drawer C audit · 09:16 opening under Imani’s badge","difficulty":"Hard","prompt":"At 09:12, a sealed archive envelope was placed in Drawer C. At 09:20 it was gone. The drawer audit shows one opening at 09:16 under Imani’s badge; Jules’s badge was used at reception, Kai was recorded continuously on a video call, and Luca’s building exit was logged at 09:05. Who opened Drawer C?","options":["Imani","Jules","Kai","Luca"],"correctIndex":0,"explanation":"The drawer audit records Imani’s badge as the only opening during the disappearance window."},
    {"id":"MM17","round":1,"visualId":"MM17","visualSummary":"Wet floor trail · umbrella-entry camera","difficulty":"Medium","prompt":"A brass key was found beside a wet umbrella stand. The corridor camera shows that only Nia entered carrying a wet umbrella; Omar carried a dry folded coat, Pia carried a paper folder, and Ravi entered before the rain began. Whose umbrella best matches the scene clue?","options":["Omar","Pia","Nia","Ravi"],"correctIndex":2,"explanation":"The wet umbrella carried by Nia is the only recorded one that matches the water trail beside the stand."},
    {"id":"MM18","round":1,"visualId":"MM18","visualSummary":"Access matrix · VPN plus one-time code","difficulty":"Hard","prompt":"A confidential file was opened at 11:40. The audit requires both VPN access and a valid one-time code. Ada had VPN but her code failed; Bo had a valid code but no VPN session; Chen had both logged successfully at 11:39; Dev had neither. Which account could open the file?","options":["Ada","Bo","Chen","Dev"],"correctIndex":2,"explanation":"Only Chen satisfies both required authentication checks."},
    {"id":"MM19","round":1,"visualId":"MM19","visualSummary":"Impact sensor · 13:03 and room-entry log","difficulty":"Hard","prompt":"A glass display cracked between 13:00 and 13:05. A sensor records impact at 13:03. Room footage shows Arlo continuously in a remote meeting, Bea exited the building at 12:58 with no re-entry, Cruz entered the display room at 13:02 and remained there, and Dia entered at 13:08. Who was present at the impact time?","options":["Arlo","Bea","Cruz","Dia"],"correctIndex":2,"explanation":"Cruz entered at 13:02, one minute before the sensor recorded the impact."},
    {"id":"MM20","round":1,"visualId":"MM20","visualSummary":"Key-ring close-up · red thread caught in ring","difficulty":"Medium","prompt":"The spare cabinet key was returned with a red thread caught in its ring. Four visitors wore distinct items: Mira a red knitted scarf, Noah a blue cap, Orla a black jacket, and Paz a yellow lanyard. The corridor footage shows Mira handling the key ring before returning it. Which clue links the key to Mira?","options":["Blue cap fibre","Red thread and handling footage","Black jacket button","Yellow lanyard clip"],"correctIndex":1,"explanation":"The red thread matches Mira’s scarf, and footage independently shows Mira handling the ring."},
    {"id":"MM21","round":1,"visualId":"MM21","visualSummary":"Version history · edit 16:42 / session start 16:40","difficulty":"Hard","prompt":"A report was altered at 16:42. The version history says the change was made in a session that began at 16:40. Sal’s session ended at 16:15; Tavi’s started at 16:40; Uma’s account was locked at noon; Vik’s device was offline all afternoon. Whose session matches the edit history?","options":["Sal","Tavi","Uma","Vik"],"correctIndex":1,"explanation":"Tavi’s session began at 16:40, the only session active when the report changed."},
    {"id":"MM22","round":1,"visualId":"MM22","visualSummary":"Tamper-strip serial comparison · 7719","difficulty":"Hard","prompt":"A parcel seal was broken, but the shipping box itself was unopened. The seal log shows the unique tamper-strip serial 7719 was issued to Rowan. The other suspects were issued 7712, 7730, and 7791. Which serial identifies the seal on the parcel?","options":["7712","7730","7719","7791"],"correctIndex":2,"explanation":"The parcel’s seal serial is 7719, the number issued to Rowan."},
    {"id":"MM23","round":1,"visualId":"MM23","visualSummary":"Safe keypad · three failures, then Harper’s successful code","difficulty":"Medium","prompt":"At 10:30, the office safe recorded three incorrect attempts followed by one successful code. The successful code belonged to Harper. Indigo’s code was disabled; Jordan had no safe privileges; Kit’s code was never entered. Who entered the successful code?","options":["Harper","Indigo","Jordan","Kit"],"correctIndex":0,"explanation":"The safe audit explicitly ties the successful entry to Harper’s assigned code."},
    {"id":"MM24","round":1,"visualId":"MM24","visualSummary":"Meeting room timeline · folder present 14:04, missing 14:06","difficulty":"Hard","prompt":"A blue folder was removed from the meeting table. Room footage shows the folder still there at 14:04 and gone at 14:06. Lee entered at 14:05 carrying an empty tote; Morgan was on a continuous video call from another office; Noor entered at 14:07; Oak had left at 14:00. Who had the only recorded opportunity to remove it?","options":["Lee","Morgan","Noor","Oak"],"correctIndex":0,"explanation":"Lee was in the room during the one-minute window when the folder disappeared."},
    {"id":"MM25","round":1,"visualId":"MM25","visualSummary":"USB checksum report · Envelope 3 assignment","difficulty":"Hard","prompt":"Four identical USB drives were placed in four numbered envelopes. A checksum report shows the missing presentation was copied to the drive in Envelope 3. The inventory log identifies Envelope 3 as assigned to Sora; the others belong to Teo, Val, and Wynn. Who was assigned the drive with the copied file?","options":["Teo","Val","Sora","Wynn"],"correctIndex":2,"explanation":"The checksum locates the copy on the Envelope 3 drive, and the inventory assigns it to Sora."},
    {"id":"MM26","round":1,"visualId":"MM26","visualSummary":"Torn paper · triangular edge match","difficulty":"Medium","prompt":"A note in the archive has a distinctive triangular tear. The four pads have edge marks: Eli’s has a square cut, Fran’s a circle, Gray’s a triangle, and Hale’s a straight edge. Which pad matches the note?","options":["Eli’s","Fran’s","Gray’s","Hale’s"],"correctIndex":2,"explanation":"The triangular tear matches Gray’s pad edge mark."},
    {"id":"MM27","round":1,"visualId":"MM27","visualSummary":"Duplicate badge alert · north and south gates at 08:15","difficulty":"Hard","prompt":"A badge was cloned. The genuine badge was used at the north gate at 08:15, while the clone was used at the south gate at 08:15—impossible for one person to be at both. A camera identifies the south-gate wearer as Remy. Which gate transaction used the clone?","options":["North gate, because it happened first","South gate, identified on camera","Both transactions were genuine","The logs cannot distinguish them"],"correctIndex":1,"explanation":"The south-gate image identifies the wearer in the impossible second transaction, so that transaction used the clone."},
    {"id":"MM28","round":1,"visualId":"MM28","visualSummary":"Cabinet access matrix · physical key + correct override","difficulty":"Hard","prompt":"A locked cabinet can be opened only with a physical key and a four-digit override. Petra had the key but entered the wrong override; Quinn had the correct override but no key; Reese had both the key and correct override recorded at 17:10; Sol had neither. Who could have opened it?","options":["Petra","Quinn","Reese","Sol"],"correctIndex":2,"explanation":"Reese alone had both required factors at the time."},
    {"id":"MM29","round":1,"visualId":"MM29","visualSummary":"Mud print and sole-pattern comparison","difficulty":"Medium","prompt":"A single muddy shoeprint leads from the garden to the archive. The tread contains three parallel bars. Ash’s shoes have three bars; Bri’s have dots; Cal’s have a zigzag; Dee’s have a crosshatch. Whose shoe made the print?","options":["Ash","Bri","Cal","Dee"],"correctIndex":0,"explanation":"The three-bar tread matches Ash’s shoe pattern exactly."},
    {"id":"MM30","round":1,"visualId":"MM30","visualSummary":"Change audit · workstation location: floor three","difficulty":"Hard","prompt":"A calendar invitation was secretly changed at 12:18. The audit says the change came from a workstation on the third floor. Emi’s workstation is on floor one, Fox’s on floor two, Gia’s on floor three, and Hal’s workstation is a remote virtual machine with no floor location. Which workstation matches the audit?","options":["Emi","Fox","Gia","Hal"],"correctIndex":2,"explanation":"Gia’s workstation is the only one on the floor specified in the audit."},
    {"id":"MM31","round":1,"visualId":"MM31","visualSummary":"Control-panel audit · PIN 4826 at 06:22","difficulty":"Hard","prompt":"The lab’s temperature alarm was silenced at 06:22. The control panel requires an employee PIN. The audit records PIN 4826. The roster maps 4826 to Ivo; Lian has 4828, Mei has 4268, and Noor has 4862. Whose PIN silenced the alarm?","options":["Ivo","Lian","Mei","Noor"],"correctIndex":0,"explanation":"The recorded PIN, 4826, belongs to Ivo."},
    {"id":"MM32","round":1,"visualId":"MM32","visualSummary":"Map fragment · grid B4 symbol match","difficulty":"Medium","prompt":"A torn map fragment contains a red square labelled B4. Of the four desk maps, only Tess’s map has a red square at B4; Uma’s has a blue square there, Val’s has a red circle, and Wes’s has no mark. Which desk map matches the fragment?","options":["Tess’s","Uma’s","Val’s","Wes’s"],"correctIndex":0,"explanation":"Tess’s map is the only one with a red square at B4."},
    {"id":"MM33","round":1,"visualId":"MM33","visualSummary":"CCTV clock offset · displayed 21:07, actual 21:09","difficulty":"Hard","prompt":"A camera clock runs exactly two minutes slow. It shows a person entering the storage room at 21:07. Access records show the actual entry was 21:09. Only Pax entered at 21:09; Rhea entered at 21:05, Seth at 21:12, and Toni had no entry. Who appears in the footage?","options":["Pax","Rhea","Seth","Toni"],"correctIndex":0,"explanation":"Correcting the camera’s two-minute lag gives 21:09, matching Pax’s entry."},
    {"id":"MM34","round":1,"visualId":"MM34","visualSummary":"Key checkout ledger · master key custody 15:20–15:45","difficulty":"Hard","prompt":"A rare stamp disappeared from a locked drawer. The drawer log shows the lock was opened using the master key at 15:30. The checkout book records the master key with Yara from 15:20 to 15:45; the other suspects checked out a meeting-room key, a bike lock key, and no key. Who had custody of the master key?","options":["Uma","Vic","Yara","Zed"],"correctIndex":2,"explanation":"Yara was the only person signed out the master key during the opening."},
    {"id":"MM35","round":1,"visualId":"MM35","visualSummary":"Cup-label evidence · star sticker","difficulty":"Medium","prompt":"Four cups were placed on a tray; one contained a harmless blue dye used in a demonstration. The lab note says the dye was in the cup with a star sticker. Lio’s cup had a circle, Mina’s a star, Niko’s a stripe, and Oona’s a square. Whose cup contained the dye?","options":["Lio","Mina","Niko","Oona"],"correctIndex":1,"explanation":"The lab note identifies the star sticker, which was on Mina’s cup."},
    {"id":"MM36","round":1,"visualId":"MM36","visualSummary":"Export permission matrix · editor + token","difficulty":"Hard","prompt":"A draft contract was exported at 17:55. Exporting requires both editor permission and a security token. Rae had editor permission but no token; Sid had a token but view-only access; Tao had both; Uma had neither. Who met both requirements?","options":["Rae","Sid","Tao","Uma"],"correctIndex":2,"explanation":"Only Tao had editor permission and the security token."},
    {"id":"MM37","round":1,"visualId":"MM37","visualSummary":"Door sensor correlation · 19:10 access log","difficulty":"Hard","prompt":"The hallway sensor records movement only when someone crosses its beam. At 19:10 the beam broke, but all four people claim to have stayed still. The adjacent door sensor records an opening at the same second, and its access log names Bea. Who is directly tied to the recorded door opening?","options":["Arun","Bea","Cleo","Dax"],"correctIndex":1,"explanation":"The adjacent door’s access log specifically names Bea at 19:10."},
    {"id":"MM38","round":1,"visualId":"MM38","visualSummary":"Library checkout record · edition and ribbon","difficulty":"Medium","prompt":"A book was returned with a yellow ribbon bookmark. The checkout sheet shows that only Kim borrowed that edition; Lee borrowed another title, Mo borrowed a magazine, and Nia did not check out any item. Who had checked out the ribbon-marked edition?","options":["Kim","Lee","Mo","Nia"],"correctIndex":0,"explanation":"The checkout sheet identifies Kim as the only borrower of that edition."},
    {"id":"MM39","round":1,"visualId":"MM39","visualSummary":"Dual-key safe log · A 09:12:02, B 09:12:08","difficulty":"Hard","prompt":"A safe requires two distinct key turns within ten seconds. The log shows Key A at 09:12:02 and Key B at 09:12:08. Key A was checked out to Dev; Key B was checked out to Esha. Fenn had a cabinet key, and Gita had no key. Who held the two recorded keys?","options":["Dev and Esha","Esha and Fenn","Dev and Gita","Fenn and Gita"],"correctIndex":0,"explanation":"The log pairs Key A with Dev and Key B with Esha."},
    {"id":"MM40","round":1,"visualId":"MM40","visualSummary":"Equipment inventory · pointer model and colour","difficulty":"Hard","prompt":"A red laser pointer was left beside the presentation screen. The room inventory shows only one pointer of that model, assigned to Ari. Bo’s pointer is green, Cy uses a clicker without a pointer, and Dee’s red pointer is a different model with a broken cap. Which inventory record matches the object?","options":["Ari’s assigned pointer","Bo’s green pointer","Cy’s clicker","Dee’s different model"],"correctIndex":0,"explanation":"The object matches the model assigned to Ari; the alternatives differ by colour or type."},

    {id:'BT01',round:2,difficulty:'Medium',prompt:'What number comes next in the pattern: 2, 4, 8, 16, …?',options:['24','30','32','34'],correctIndex:2,explanation:'Each number doubles: 2 → 4 → 8 → 16 → 32.'},
    {id:'BT02',round:2,difficulty:'Medium',prompt:'What has many keys but cannot open a single lock?',options:['A piano','A keyring','A map','A toolbox'],correctIndex:0,explanation:'A piano has keys used to play notes, not to open locks.'},
    {id:'BT03',round:2,difficulty:'Medium',prompt:'Five teammates each shake hands with every other teammate exactly once. How many handshakes happen in total?',options:['5','8','10','20'],correctIndex:2,explanation:'There are 5 × 4 ÷ 2 unique pairs, which equals 10 handshakes.'},
    {id:'BT04',round:2,difficulty:'Medium',prompt:'There are five apples in a basket. You take two apples out. How many apples do you have?',options:['2','3','5','7'],correctIndex:0,explanation:'You took two apples, so you have two apples.'},
    {id:'BT05',round:2,difficulty:'Medium',prompt:'Find the next number: 3, 6, 11, 18, 27, …',options:['35','36','38','40'],correctIndex:2,explanation:'The differences are +3, +5, +7, +9, so the next difference is +11: 27 + 11 = 38.'},
    {id:'BT06',round:2,difficulty:'Medium',prompt:'In a race, you overtake the runner in second place. What place are you in now?',options:['First','Second','Third','It depends on the finish line'],correctIndex:1,explanation:'You take the position of the runner you overtook: second place.'},
    {id:'BT07',round:2,difficulty:'Medium',prompt:'Three switches are outside a closed room. One controls a traditional bulb inside. You may operate switches as you wish, but enter the room only once. Which plan identifies the correct switch?',options:['Turn A on for five minutes, turn it off; turn B on; enter. Lit = B, warm = A, cool = C.','Turn all three on, then enter and guess.','Turn A on and enter immediately; the bulb will reveal all three.','Turn A and B on, turn both off, then enter and guess.'],correctIndex:0,explanation:'The bulb’s light tells you whether B is on; its warmth distinguishes a recently switched-off A from untouched C.'},
    {id:'BT08',round:2,difficulty:'Medium',prompt:'A cube is painted on all six faces, then cut into 27 identical smaller cubes (a 3 × 3 × 3 grid). How many small cubes have exactly two painted faces?',options:['6','8','12','18'],correctIndex:2,explanation:'Exactly two painted faces appear on the middle cube of each edge. A cube has 12 edges, so there are 12 such cubes.'},
    {id:'BT09',round:2,difficulty:'Hard',prompt:'What is the smaller angle between the hands of a clock at exactly 3:15?',options:['0°','7.5°','15°','22.5°'],correctIndex:1,explanation:'At 3:15 the minute hand is at 90°. The hour hand has moved to 97.5°, leaving a 7.5° angle.'},
    {id:'BT10',round:2,difficulty:'Hard',prompt:'One of eight identical-looking balls is heavier than the other seven. Using a balance scale, what is the minimum number of weighings that guarantees you can identify the heavier ball?',options:['1','2','3','4'],correctIndex:1,explanation:'Weigh three against three. If balanced, weigh the remaining two; if not, weigh two from the heavier group of three. Two weighings always suffice.'},
    {id:'BT11',round:2,difficulty:'Medium',prompt:'Which number does not belong in this set: 16, 25, 36, 40?',options:['16','25','36','40'],correctIndex:3,explanation:'16, 25, and 36 are perfect squares; 40 is not.'},
    {id:'BT12',round:2,difficulty:'Medium',prompt:'Three boxes are labelled PENS, PENCILS, and MIXED. Every label is wrong. You draw one pencil from the box labelled MIXED. Which statement must be true?',options:['The MIXED-labelled box contains only pencils.','The PENS-labelled box contains only pens.','The PENCILS-labelled box is mixed.','No label can be corrected.'],correctIndex:0,explanation:'Because every label is wrong, the MIXED-labelled box cannot be mixed. Drawing a pencil proves it contains only pencils.'},
    {id:'BT13',round:2,difficulty:'Medium',prompt:'What number comes next: 1, 4, 10, 19, 31, …?',options:['43','45','46','49'],correctIndex:2,explanation:'The differences are +3, +6, +9, and +12. The next difference is +15, so 31 + 15 = 46.'},
    {id:'BT14',round:2,difficulty:'Medium',prompt:'A review meeting is scheduled for Friday. It is moved two days earlier, then moved two more days earlier. On what day is it now scheduled?',options:['Sunday','Monday','Tuesday','Wednesday'],correctIndex:1,explanation:'Two days before Friday is Wednesday; two more days earlier is Monday.'},
    {id:'BT15',round:2,difficulty:'Hard',prompt:'A three-digit code follows these clues: 682 has one correct digit in the right place; 614 has one correct digit but in the wrong place; 206 has two correct digits, both in the wrong places; 738 has no correct digits; 780 has one correct digit in the wrong place. What is the code?',options:['042','204','420','402'],correctIndex:0,explanation:'738 eliminates 7, 3, and 8. From 780, 0 is present but not last; 682 places 2 last and excludes 6 and 8. Clue 206 puts 0 in the middle, and clue 614 places 4 in the first position, giving 042.'},

    {"id":"BT16","round":2,"difficulty":"Hard","prompt":"What number comes next: 3, 8, 15, 24, 35, …?","options":["44","46","48","50"],"correctIndex":2,"explanation":"The differences are 5, 7, 9, 11, so the next difference is 13; 35 + 13 = 48."},
    {"id":"BT17","round":2,"difficulty":"Medium","prompt":"A code replaces each letter with the next letter in the alphabet. Under this rule, CAT becomes DBU. What does DOG become?","options":["EPH","EOG","CNG","FPH"],"correctIndex":0,"explanation":"D→E, O→P, and G→H, giving EPH."},
    {"id":"BT18","round":2,"difficulty":"Hard","prompt":"A clock takes 5 seconds to strike 6 times, with equal intervals between strikes. How long does it take to strike 12 times?","options":["10 seconds","11 seconds","12 seconds","15 seconds"],"correctIndex":1,"explanation":"Six strikes have five intervals. Twelve strikes have eleven intervals, each one second long: 11 seconds."},
    {"id":"BT19","round":2,"difficulty":"Medium","prompt":"A drawer contains 5 black socks and 5 white socks. In complete darkness, what is the minimum number of socks to take to guarantee a matching-colour pair?","options":["2","3","4","5"],"correctIndex":1,"explanation":"With only two colours, three socks guarantee that at least two share a colour."},
    {"id":"BT20","round":2,"difficulty":"Hard","prompt":"A number has two digits. Its digits sum to 11, and reversing the digits makes the number 27 smaller. What is the original number?","options":["47","65","74","83"],"correctIndex":2,"explanation":"74 has digits summing to 11; reversing it gives 47, which is 27 smaller."},
    {"id":"BT21","round":2,"difficulty":"Medium","prompt":"All glimmers are coded. No coded item is public. Which statement must be true?","options":["All public items are glimmers","No glimmer is public","Some coded items are glimmers","All coded items are glimmers"],"correctIndex":1,"explanation":"Every glimmer is coded, and no coded item is public; therefore no glimmer is public."},
    {"id":"BT22","round":2,"difficulty":"Hard","prompt":"A sequence alternates multiplying by 2 and adding 3: 4, 8, 11, 22, 25, … What comes next?","options":["28","45","50","53"],"correctIndex":2,"explanation":"The operations alternate ×2, +3, ×2, +3, so the next operation is ×2: 25 × 2 = 50."},
    {"id":"BT23","round":2,"difficulty":"Medium","prompt":"A meeting begins 35 minutes after 14:40 and lasts 1 hour 25 minutes. At what time does it end?","options":["16:20","16:30","16:40","16:50"],"correctIndex":2,"explanation":"The meeting starts at 15:15 and ends 85 minutes later at 16:40."},
    {"id":"BT24","round":2,"difficulty":"Hard","prompt":"Three boxes are labelled APPLES, ORANGES, and MIXED. Every label is wrong. You may draw one fruit from one box. Which box should you choose first to correctly relabel all three boxes?","options":["APPLES","ORANGES","MIXED","Any box works equally well"],"correctIndex":2,"explanation":"The box labelled MIXED cannot be mixed, so one fruit drawn from it reveals its true single-fruit contents; the two remaining wrong labels can then be deduced."},
    {"id":"BT25","round":2,"difficulty":"Medium","prompt":"If 4 printers print 4 pages in 4 minutes at the same constant rate, how many minutes do 8 identical printers need to print 8 pages?","options":["2 minutes","4 minutes","8 minutes","16 minutes"],"correctIndex":1,"explanation":"Each printer produces one page in four minutes, so eight printers produce eight pages in four minutes."},
    {"id":"BT26","round":2,"difficulty":"Hard","prompt":"A number is multiplied by 3, then 8 is added, producing 41. What was the original number?","options":["9","10","11","12"],"correctIndex":2,"explanation":"Subtract 8 to get 33, then divide by 3: 11."},
    {"id":"BT27","round":2,"difficulty":"Medium","prompt":"Which item does not belong in this sequence by its mathematical property: 9, 16, 25, 36, 48?","options":["9","16","36","48"],"correctIndex":3,"explanation":"9, 16, 25, and 36 are perfect squares; 48 is not."},
    {"id":"BT28","round":2,"difficulty":"Hard","prompt":"A courier must visit rooms A, B, C, and D. A is before C. D is after B. C is before D. Which room must be last?","options":["A","B","C","D"],"correctIndex":3,"explanation":"The constraints give A before C before D and B before D, so D must follow every other room."},
    {"id":"BT29","round":2,"difficulty":"Medium","prompt":"A jar has 12 identical-looking tokens: 5 triangles, 4 circles, and 3 squares. Without looking, what is the minimum number to draw to guarantee two tokens of the same shape?","options":["3","4","5","6"],"correctIndex":1,"explanation":"There are three shapes, so drawing four tokens guarantees at least two of one shape."},
    {"id":"BT30","round":2,"difficulty":"Hard","prompt":"A four-digit PIN uses distinct digits. The first digit is twice the last. The second digit is 1 more than the third. Which PIN satisfies these rules?","options":["6543","8354","4261","6423"],"correctIndex":0,"explanation":"6543 has distinct digits; 6 is twice 3, and 5 is one more than 4."},
    {"id":"BT31","round":2,"difficulty":"Medium","prompt":"A team has 6 members. Every pair meets exactly once for a two-person check-in. How many check-ins take place?","options":["12","15","18","30"],"correctIndex":1,"explanation":"Each pair is counted once: 6 × 5 ÷ 2 = 15."},
    {"id":"BT32","round":2,"difficulty":"Hard","prompt":"Which word begins with the letters ST and has ONE as its final three letters?","options":["STONE","SHONE","ATONE","ALONE"],"correctIndex":0,"explanation":"Removing the first two letters, S and T, from STONE leaves ONE."},
    {"id":"BT33","round":2,"difficulty":"Medium","prompt":"A train leaves every 18 minutes. One departs at 09:07. Which time is a departure if the schedule remains unchanged?","options":["09:40","09:43","09:45","09:52"],"correctIndex":1,"explanation":"The departures are 09:07, 09:25, 09:43, and so on."},
    {"id":"BT34","round":2,"difficulty":"Hard","prompt":"A sequence is made by adding the two previous terms: 2, 3, 5, 8, 13, … What is the next term?","options":["18","20","21","22"],"correctIndex":2,"explanation":"The next term is 8 + 13 = 21."},
    {"id":"BT35","round":2,"difficulty":"Medium","prompt":"A rectangle has a perimeter of 30 cm. Its length is 3 cm more than its width. What is its length?","options":["6 cm","7 cm","9 cm","10 cm"],"correctIndex":2,"explanation":"Let width be w; 2(w + w + 3) = 30, so w = 6 and length = 9 cm."},
    {"id":"BT36","round":2,"difficulty":"Hard","prompt":"Exactly one of three statements is true. Ada says the key is in box 1. Ben says the key is not in box 1. Cy says the key is not in box 2. In which box is the key?","options":["Box 1","Box 2","Box 3","Cannot be determined"],"correctIndex":1,"explanation":"If the key is in box 2, Ada’s statement is false, Ben’s is true, and Cy’s is false—exactly one true statement."},
    {"id":"BT37","round":2,"difficulty":"Medium","prompt":"What is the smallest positive number divisible by both 6 and 8?","options":["12","18","24","48"],"correctIndex":2,"explanation":"The least common multiple of 6 and 8 is 24."},
    {"id":"BT38","round":2,"difficulty":"Hard","prompt":"A five-character code has the form ABABA. Each letter is a digit, A is not zero, and A + B = 9. If the code’s digit sum is 27, what is A?","options":["3","5","7","9"],"correctIndex":3,"explanation":"The digit sum is 3A + 2B = 27. Since A + B = 9, subtracting twice that equation gives A = 9, so B = 0."},

layers take turns tapping their answer on the shared device; each choice is hidden before the next turn.</p><h3>Scoring and tie-breaks</h3><p>Each correct answer earns 5 points. Wrong, changed-to-no-answer, and unanswered questions earn zero. There is no speed bonus or negative marking. A three-or-more correct streak shows a cosmetic badge only. A first-place tie triggers up to three sudden-death backup questions among tied players. If the backup questions cannot split the tie, co-winners are declared.</p><h3>Host controls and shortcuts</h3><ul><li><kbd>Space</kbd> — start/pause; <kbd>1–9</kbd> — select a player for host entry; <kbd>A–D</kbd> — log the selected player’s answer.</li><li><kbd>Enter</kbd> — reveal once all players have answered, or move forward from a revealed/summary screen.</li><li>Use Reset timer, Skip question, Skip Round in the top bar, Previous-question review, Edit-score override, Mute, Fullscreen, Auto-advance, and Restart game controls as needed. Score overrides require confirmation.</li></ul><div class="modal-actions"><button class="primary" data-action="close-modal">Got it</button></div></section></div>';

  function attachOnlineSocketHandlers(){

    onlineSocket.on('room:closed',()=>{onlineRoom=null;onlineQrData='';onlinePlayerUrl='';mobileConnectedCount=0;toast('The online room was closed.');render();});
    onlineSocket.on('mobile:answer',packet=>{
      if(!packet||!Number.isInteger(packet.playerIndex)||!Number.isInteger(packet.optionIndex))return;
      if(packet.questionId!==state.currentQuestion?.id||state.paused)return;
      if(state.phase==='QUESTION'&&!state.locked&&(state.questionDeadline===null||Date.now()<=state.questionDeadline)&&packet.phase==='QUESTION')setAnswer(packet.playerIndex,packet.optionIndex);

  }
  function launchConfetti(){
    stopConfetti();if(reducedMotion||!ctx||!canvas)return;
    try{
      canvas.width=window.innerWidth;canvas.height=window.innerHeight;canvas.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25';
      const palette=['#f0c66a','#36bd83','#76b9ff','#e78db7','#ff8a70','#ffffff'];
      confettiPieces=Array.from({length:115},()=>({x:Math.random()*canvas.width,y:-Math.random()*canvas.height*.6,w:4+Math.random()*6,h:5+Math.random()*8,vx:(Math.random()-.5)*2,vy:2+Math.random()*4,rot:Math.random()*6,vr:(Math.random()-.5)*.15,color:palette[Math.floor(Math.random()*palette.length)]}));
      confettiEnd=Date.now()+4200;
      const frame=()=>{if(!ctx||!canvas)return;ctx.clearRect(0,0,canvas.width,canvas.height);confettiPieces.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;if(p.y>canvas.height+20){p.y=-15;p.x=Math.random()*canvas.width;}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});if(Date.now()<confettiEnd){confettiFrame=requestAnimationFrame(frame);}else{stopConfetti();}};
      confettiFrame=requestAnimationFrame(frame);
    }catch(_){stopConfetti();}
  }
  async function toggleFullscreen(){
    try{if(!document.fullscreenElement){const fn=document.documentElement.requestFullscreen;if(fn)await fn.call(document.documentElement);}else if(document.exitFullscreen)await document.exitFullscreen();}catch(_){toast('Fullscreen is not available in this browser.');}
  }
  function selectHostPlayer(idx){if(!Number.isInteger(idx)||idx<0||idx>=state.players.length)return;state.selectedPlayer=idx;render();toast('Selected '+state.players[idx].name+' for keyboard entry.');}
  function hotseatReady(){if(state.phase!=='QUESTION'||!state.hotSeatMode)return;state.hotSeatReady=true;render();}
  function hotseatAnswer(option){
    if(state.phase!=='QUESTION'||!state.hotSeatMode||!state.hotSeatReady||state.locked||state.paused)return;
    const pending=state.players.map((_,i)=>i).filter(i=>state.answers[i]===null);if(!pending.length)return;const player=pending[0];
    state.answers[player]=option;state.hotSeatReady=false;render();announce('Private answer recorded. Pass the device to the next player.');
    if(state.answers.every(a=>a!==null))toast('All player answers are in. Pass the device to the host.');
  }
  function keydownHandler(e){
    if(state.modal){if(e.key==='Escape'){state.modal=null;render();}return;}
    const target=e.target;const isTyping=target&&(target.tagName==='INPUT'||target.tagName==='TEXTAREA'||target.tagName==='SELECT'||target.isContentEditable);
    if(isTyping)return;
    if(e.code==='Space'){e.preventDefault();if(state.phase==='ROUND_INTRO')startRound();else pauseResume();return;}
    if(e.key==='Enter'){
      if(state.phase==='QUESTION'&&state.answers.every(a=>a!==null))revealQuestion('manual');
      else if(state.phase==='REVEAL')advanceAfterReveal();
      else if(state.phase==='ROUND_SUMMARY')continueFromSummary();
      else if(state.phase==='ROUND_INTRO')startRound();
      else if(state.phase==='TIEBREAKER'&&!state.tie.revealed&&state.tie.eligible.every(i=>state.tie.answers[i]!==null))revealTiebreaker('manual');
      else if(state.phase==='TIEBREAKER'&&state.tie.revealed)continueTiebreaker();
      return;
    }
    if(/^[1-9]$/.test(e.key)&&state.players.length>0&&Number(e.key)<=state.players.length){selectHostPlayer(Number(e.key)-1);return;}
    if(/^[a-d]$/i.test(e.key)){
      const opt=e.key.toUpperCase().charCodeAt(0)-65;
      if(state.phase==='QUESTION'&&!state.hotSeatMode){setAnswer(state.selectedPlayer,opt);return;}
      if(state.phase==='TIEBREAKER'&&state.tie.eligible.includes(state.selectedPlayer)){setTiebreakerAnswer(state.selectedPlayer,opt);return;}
    }
  }
  function clickHandler(e){
    const button=e.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;
    try{
      switch(action){
        case 'help':openHelp();break;
        case 'mobile-room':openMobileRoom();break;
        case 'copy-mobile-link':copyMobileLink();break;
        case 'close-modal':state.modal=null;render();break;
        case 'scroll-register':document.getElementById('registration')?.scrollIntoView({behavior:reducedMotion?'auto':'smooth',block:'start'});document.getElementById('playerName0')?.focus();break;
        case 'start-game':registerPlayers();break;
        case 'add-player':addPlayer();break;
        case 'remove-player':removePlayer(Number(button.dataset.player));break;
        case 'start-round':startNextFromIntro();break;
        case 'pause':pauseResume();break;
        case 'reset-timer':resetTimer();break;
        case 'skip-question':skipQuestion();break;
        case 'skip-round':skipRound();break;
        case 'host-answer':setAnswer(Number(button.dataset.player),Number(button.dataset.option));break;
        case 'lock-reveal':if(state.phase==='QUESTION'&&state.answers.every(a=>a!==null))revealQuestion('manual');else if(state.phase==='TIEBREAKER'&&state.tie.eligible.every(i=>state.tie.answers[i]!==null))revealTiebreaker('manual');break;
        case 'next':advanceAfterReveal();break;
        case 'continue-summary':continueFromSummary();break;
        case 'review':showPreviousReview();break;
        case 'edit-score':openScoreOverride();break;
        case 'apply-score':applyScoreOverride();break;
        case 'restart':restartGame();break;
        case 'mute':state.muted=!state.muted;if(!state.muted)ensureAudio();render();toast(state.muted?'Sound muted.':'Sound enabled.');break;
        case 'theme':state.lightMode=!state.lightMode;render();break;
        case 'fullscreen':toggleFullscreen();break;
        case 'hotseat-ready':hotseatReady();break;
        case 'hotseat-answer':hotseatAnswer(Number(button.dataset.option));break;
        case 'tie-answer':setTiebreakerAnswer(state.selectedPlayer,Number(button.dataset.option));break;
        case 'tie-host-answer':setTiebreakerAnswer(Number(button.dataset.player),Number(button.dataset.option));break;
        case 'tie-reveal':if(state.tie.eligible.every(i=>state.tie.answers[i]!==null))revealTiebreaker('manual');break;
        case 'continue-tie':continueTiebreaker();break;
        case 'confirm-spirit':spiritAwardConfirm();break;
        case 'play-again':resetEntireGame();break;
        case 'copy-results':copyResults();break;
        case 'select-copy-text':{const ta=document.getElementById('fallbackResults');if(ta){ta.focus();ta.select();}break;}
      }
    }catch(_){toast('That action could not be completed. Please try again.');}
  }
  function changeHandler(e){
    const target=e.target;
    if(target.id==='autoAdvanceSwitch'){state.autoAdvance=!!target.checked;if(!state.autoAdvance){state.autoAdvanceDeadline=null;state.autoAdvanceRemainingMs=null;}else if(state.phase==='REVEAL'&&!state.paused){state.autoAdvanceDeadline=Date.now()+REVEAL_TIME_MS;}else if(state.phase==='REVEAL'&&state.paused){state.autoAdvanceRemainingMs=REVEAL_TIME_MS;}render();}
    else if(target.id==='hotSeatSwitch'){state.hotSeatMode=!!target.checked;}
    else if(target.id==='spiritSelect'){state.spiritPick=target.value;}
  }
  function inputHandler(e){if(e.target&&e.target.dataset&&e.target.dataset.nameIndex!==undefined)handleNameInput(e.target);}
  function resizeHandler(){if(ctx&&canvas&&confettiFrame!==null){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}}

  app.addEventListener('click',clickHandler);
  app.addEventListener('input',inputHandler);
  app.addEventListener('change',changeHandler);
  document.addEventListener('keydown',keydownHandler);
  window.addEventListener('resize',resizeHandler);
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.phase==='QUESTION'&&!state.paused){/* timestamp deadline remains authoritative when the tab returns */}});

  const bankIsValid=validateBank();
  if(!bankIsValid){app.innerHTML='<main style="max-width:760px;margin:10vh auto;padding:28px;color:#fff;background:#321f26;border:1px solid #a44;border-radius:18px;font:16px system-ui"><h1>Question bank validation failed</h1><p>The app has stopped safely because its built-in question bank did not pass validation.</p></main>';return;}
  // One structured game state drives every screen; no browser storage or external requests are used. A randomized subset is selected from the offline question bank on each load.
  render();
})();
</script>
</body>
</html>
